                      Text(subtitle)
                          .font(.system(size: 10, weight: .medium))
                          .foregroundColor(.gray)
                  }
                  .padding(10)
                  .frame(maxWidth: .infinity)
                  .background(RoundedRectangle(cornerRadius: 14).fill(Color.white.opacity(0.07)))
