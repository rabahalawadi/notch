      - name: Install XcodeGen & Generate Xcode Project
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Unsigned Release .app for iOS (arm64)
        run: |
          xcodebuild clean build \
            -project NotchIsland.xcodeproj \
            -scheme NotchIsland \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa
        run: |
          APP_PATH=$(find build -name "NotchIsland.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/NotchIsland.app
          codesign --force --deep --sign - Payload/NotchIsland.app || true
          zip -r9 NotchIsland-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland-Unsigned-IPA
          path: NotchIsland-Unsigned.ipa
          if-no-files-found: error
