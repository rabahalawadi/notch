                              Circle()
                                  .fill(Color.white.opacity(0.14))
                                  .frame(width: 44, height: 44)
                                  .overlay(
                                      Image(systemName: "arrow.counterclockwise")
                                          .font(.system(size: 17, weight: .bold))
                                          .foregroundColor(.white)
                                  )
                          }
                      }
                  }
