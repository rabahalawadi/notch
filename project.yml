name: NotchIsland
options:
  bundleIdPrefix: com.notchisland
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO

targets:
  NotchIsland:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NotchIsland
        excludes:
          - "**/*.plist"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NotchIsland
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: "NotchIsland uses media playback info to display currently playing tracks and controls inside your expanded notch island."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchisland.iphone11
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
